name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace_vps:
        description: Replace VPS source with GitHub after backing up local changes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  deploy:
    # Enabled after the first verified deployment; false pauses future runs.
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts
        run: bash -n deploy/vps.sh
      - name: Test deployment behavior
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          REPLACE_VPS: ${{ inputs.replace_vps }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          mode=''
          if [[ "$REPLACE_VPS" = true ]]; then
            mode=--replace-vps
          fi
          # Read the entire script before executing so child processes cannot
          # consume later commands from SSH stdin.
          remote_command='script=$(mktemp); trap '\''rm -f "$script"'\'' EXIT; cat > "$script"; bash "$script" "$@" < /dev/null'
          printf -v escaped_command '%q' "$remote_command"
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" "bash -c $escaped_command -- '$GITHUB_SHA' '$mode'" < deploy/vps.sh
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
