name: Check VPS access

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-vps.yml
      - deploy/check-vps.sh
  workflow_dispatch:
    inputs:
      backup:
        description: Create private source and database backups on the VPS
        type: boolean
        default: false
      snapshot_certificate:
        description: Optional public certificate for an encrypted source comparison archive
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-vps
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_PORT; do
            if test -n "${!name}"; then
              echo "$name is available"
            else
              echo "Missing $name secret"
              missing=1
            fi
          done
          if test -z "$SSH_KEY"; then
            echo 'Missing VPS_SSH_KEY secret'
            missing=1
          fi
          if test -z "$KNOWN_HOSTS"; then
            echo 'Missing VPS_KNOWN_HOSTS secret'
            missing=1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null; then
            echo 'VPS_SSH_KEY is a valid unencrypted private key'
          else
            echo 'VPS_SSH_KEY must contain the complete unencrypted private key'
            missing=1
          fi
          test "$missing" = 0
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Inspect VPS prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST secret'; exit 1; }
          test -n "$VPS_USER" || { echo 'Missing VPS_USER secret'; exit 1; }
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VPS_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          port="${VPS_PORT:-22}"
          [[ "$port" =~ ^[0-9]+$ ]]
          bash -n deploy/check-vps.sh
          ssh -i ~/.ssh/deploy_key -p "$port" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/check-vps.sh
      - name: Back up live application on VPS
        if: inputs.backup == true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/backup-vps.sh
      - name: Collect encrypted source for comparison
        if: inputs.snapshot_certificate != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SNAPSHOT_CERTIFICATE: ${{ inputs.snapshot_certificate }}
        run: |
          set -o pipefail
          printf '%s\n' "$SNAPSHOT_CERTIFICATE" > snapshot-cert.pem
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$VPS_USER@$VPS_HOST" \
            'tar -czf - --exclude="*.bak*" --exclude="*.backup*" -C /opt/tracking-tiang backend/app backend/routes backend/database/migrations backend/bootstrap/app.php backend/composer.json backend/composer.lock backend/tests -C /opt/tracking-tiang/frontend-next frontend/app frontend/components frontend/lib frontend/src frontend/scripts frontend/next.config.mjs frontend/capacitor.config.json frontend/package.json frontend/package-lock.json' \
            | openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -out vps-source.tar.gz.enc snapshot-cert.pem
      - uses: actions/upload-artifact@v4
        if: inputs.snapshot_certificate != ''
        with:
          name: vps-source-encrypted
          path: vps-source.tar.gz.enc
          retention-days: 1
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
